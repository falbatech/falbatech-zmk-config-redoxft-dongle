# Prawa połówka — peryferyjny peripheral
CONFIG_ZMK_DISPLAY=n

CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_POINTING=y

# RGB — 35 per-key LEDs (WS2812_STRIP auto-selected from devicetree in Zephyr 4.1)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
# Bez AUTO_OFF — LEDy zawsze świecą, nie gasną po bezczynności
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Tick 1Hz zamiast domyślnych 25Hz — minimalizuje okna SPI podczas BLE radio
CONFIG_ZMK_RGB_UNDERGLOW_TICK_FREQ=1
