# ── Wyświetlacz GC9A01 240×240 ─────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=10

# ── Wskaźniki HID (Caps/Num Lock) ──────────────────────────────
CONFIG_ZMK_HID_INDICATORS=y

# ── Łączność ────────────────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split central: dongle + 2 połówki ───────────────────────────
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# 5 profili BT dla hostów + 2 połówki peryferyjne
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# ── Bateria połówek ─────────────────────────────────────────────
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ── ZMK Studio ─────────────────────────────────────────────────
CONFIG_ZMK_STUDIO=y

# ── WPM (słowa na minutę) ────────────────────────────────────────
CONFIG_ZMK_WPM=y

# ── RGB Underglow (wirtualny na dongle, stan sync do połówek przez BLE) ─
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40
# Bez AUTO_OFF — inaczej ekran gaśnie razem z LEDami (ZMK linkuje display z underglow)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# ── Pozostałe ───────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
